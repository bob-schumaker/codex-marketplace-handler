[project]
name = "marketplace-installer"
version = "0.1.0"
description = "Package and install Codex router plugins into a marketplace."
authors = [{ name = "Anonymous" }]
requires-python = ">=3.12,<4.0"
dependencies = ["packaging==26.3", "PyYAML==6.0.3"]

[project.scripts]
marketplace-installer = "marketplace_installer.router_plugin_packager:main"
router-plugin-packager = "marketplace_installer.router_plugin_packager:main"
router-plugin-first-user-flow = "marketplace_installer.router_plugin_first_user_flow:main"
mcp-plugin-packaging-customer-flow = "marketplace_installer.mcp_plugin_packaging_customer_flow:main"
router-plugin-packager-setup = "marketplace_installer.router_plugin_packager_setup:main"
plugin-runtime-lifecycle = "marketplace_installer.plugin_runtime_lifecycle:main"
codex-packaging-toolchain = "marketplace_installer.codex_packaging_toolchain_launcher:main"

[tool.poetry]
packages = [{ include = "marketplace_installer", from = "src" }]
include = ["src/marketplace_installer/*.json"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0"
pytest = "^8.0"
ruff = "^0.12.0"
rumdl = "^0.2.0"
copier = "^9.17.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: marks tests that reach a real service"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
